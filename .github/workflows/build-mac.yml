name: Build Mac (test)

# Fabrique Pilote.app sur une machine Mac de GitHub, la lance et verifie
# qu'elle demarre (docs/mac.md). Rien n'est publie dans les releases : le
# resultat (capture d'ecran, journal, app zippee) reste attache a l'execution,
# et les constats principaux sortent en annotations, lisibles sans compte.
# Ne se declenche que sur la branche mac : release.yml (tags v*) n'est pas
# concerne, un echec ici ne peut pas bloquer le Setup Windows.

on:
  push:
    branches: [mac]
    paths-ignore: ['docs/**', '**.md']   # la documentation seule ne change pas l'app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-15          # puce Apple
    timeout-minutes: 40        # une etape figee ne garde pas la machine 6 h

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app (PyInstaller)
        # Les journaux ne se lisent qu'avec un compte : en cas d'echec, la fin
        # du journal sort en annotation, lisible par l'API publique
        run: |
          set +e
          python -m PyInstaller build/pilote-mac.spec --clean --noconfirm > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            MSG=$(tail -n 40 build.log | python -c "import sys; print(sys.stdin.read().replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A'))")
            echo "::error title=PyInstaller::$MSG"
          fi
          exit $CODE

      - name: Check bundle
        run: |
          test -x dist/Pilote.app/Contents/MacOS/Pilote
          ls dist/Pilote.app/Contents/Resources/ui/
          ls dist/Pilote.app/Contents/Resources/ui/vendor/
          # verifie aussi par le job mac de release.yml
          test -f dist/Pilote.app/Contents/Resources/nouveautes.json
          echo "::notice title=Bundle::$(du -sh dist/Pilote.app | cut -f1) - ui et vendor presents"

      - name: Launch and check
        run: |
          DONNEES="$HOME/Library/Application Support/Pilote/Donnees"
          # Un Mac ordinaire n'a pas le Python de la machine de GitHub, ou l'app
          # compilee cherche ses certificats : on les cache pendant le test, pour
          # verifier le repli de plateforme.certificats_mac (docs/mac.md)
          CERT=$(python -c "import ssl; print(ssl.get_default_verify_paths().openssl_cafile)")
          sudo mv "$CERT" "$CERT.cache" && echo "::notice title=Certificats::$CERT cache pendant le test"
          # Une « cle » pour l'essai USB d'app.py (_diag_usb) : image disque FAT
          hdiutil create -size 20m -fs MS-DOS -volname CLETEST -o cle.dmg > /dev/null
          hdiutil attach cle.dmg > /dev/null || echo "image disque non montee"
          # PILOTE_DIAG : app.py ecrit le journal de demarrage de la page (« [diag] »)
          PILOTE_DIAG=1 dist/Pilote.app/Contents/MacOS/Pilote > pilote.log 2>&1 &
          PID=$!

          # 1. Le serveur local repond
          UP=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7438/ping > /dev/null 2>&1; then UP="$i"; break; fi
            sleep 1
          done
          # 2. L'interface a fini de demarrer (ligne ecrite par reveal_main_window)
          for i in $(seq 1 40); do
            grep -q "fenetre ouverte" pilote.log && break
            sleep 1
          done
          sleep 5
          screencapture -x capture.png || echo "capture impossible"

          VENDOR=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7438/vendor/chart.umd.js || true)
          OUVERTE=$(grep -o "fenetre ouverte ([a-z]*)" pilote.log || echo "pas de ligne")
          # (10 annotations au plus par etape : une seule pour serveur et interface)
          echo "::notice title=Serveur::ping ${UP:-KO} s - /vendor/chart.umd.js HTTP $VENDOR - $OUVERTE"
          echo "::notice title=Donnees::$(ls "$DONNEES" 2>/dev/null | tr '\n' ' ' || echo absent)"
          # 3. Le journal de demarrage de la page, ecrit 30 s apres le lancement
          for i in $(seq 1 40); do
            grep -q "\[diag\]" pilote.log && break
            sleep 1
          done
          echo "::notice title=Diag::$(grep "\[diag\]" pilote.log | head -c 3000 || echo absent)"
          # 4. Certificats HTTPS (Yahoo, Gmail, GitHub), essayes par app.py
          #    16 s apres le lancement ; jusqu'a 60 s si le reseau traine
          for i in $(seq 1 60); do
            grep -q "\[https\] cours" pilote.log && break
            sleep 1
          done
          echo "::notice title=HTTPS::$(grep -E "\[https\]|Yahoo/query" pilote.log | tr '\n' ' ' | head -c 3000 || echo absent)"
          # 5. Fenetre et fermeture (app.py, _diag_fenetre a 45 s) : apres
          #    « Quitter » (comme Cmd+Q), l'app doit ecrire ce qui attendait et
          #    se fermer seule
          for i in $(seq 1 60); do
            grep -qE "\[fenetre\] (Quitter|KO)" pilote.log && break
            sleep 1
          done
          FIN="encore ouverte apres 20 s"
          for i in $(seq 1 20); do
            if ! kill -0 $PID 2>/dev/null; then FIN="fermee seule en $i s"; break; fi
            sleep 1
          done
          ECRIT=$(grep -l "ecrit avant de quitter" "$DONNEES"/users/*/pea_data.json 2>/dev/null | wc -l | tr -d ' ')
          MAXI=$(grep -ho '"windowMaximized": *[a-z]*' "$DONNEES"/users/*/pea_data.json 2>/dev/null | head -1)
          echo "::notice title=Fenetre::$(grep -E "\[fenetre\]|\[app\] fermeture" pilote.log | tr '\n' ' ' | head -c 3000)"
          # Bibliotheques embarquees, et filtre du selecteur de fichiers (_diag_fichiers, 36 s)
          echo "::notice title=Modules::$(grep -E "\[(module|fichiers)\]" pilote.log | tr '\n' ' ' || echo absent)"
          echo "::notice title=Fermeture::$FIN ; ecriture en attente retrouvee dans $ECRIT pea_data.json ; $MAXI"
          # Essai USB d'app.py (_diag_usb, 25 s apres le lancement) : fini a ce stade
          echo "::notice title=USB::$(grep "\[usb\]" pilote.log | tr '\n' ' ' | head -c 3000 || echo absent)"
          # Lecture d'images, Trousseau, rapport (app.py, _diag_mac_divers a 30 s).
          # (remplace le journal brut : 10 annotations au plus par etape)
          echo "::notice title=Divers::$(grep -E "\[(ocr|trousseau|rapport)\]" pilote.log | tr '\n' ' ' | head -c 3000 || echo absent)"

          kill $PID 2>/dev/null || true
          sleep 2
          sudo mv "$CERT.cache" "$CERT" 2>/dev/null || true

          # Echecs bloquants : serveur muet, erreur JavaScript au demarrage de
          # la page (journal [diag]), donnees au mauvais endroit
          test -n "$UP"
          if grep "\[diag\]" pilote.log | grep -q "ERREUR "; then echo "::error title=Diag::erreur JavaScript au demarrage"; exit 1; fi
          test -d "$DONNEES"
          test ! -e dist/Pilote.app/Contents/MacOS/Donnees

      - name: Update test
        # Mise a jour faite par Pilote lui-meme (updater._installer_mac) : l'app
        # du build est posee dans /Applications, une « nouvelle version » (la
        # meme, plus un fichier temoin) est servie en local comme une release
        # 99.0.0 ; Pilote doit la telecharger, se remplacer et se relancer.
        if: always()
        run: |
          rm -rf /Applications/Pilote.app
          ditto dist/Pilote.app /Applications/Pilote.app
          rm -rf maj && mkdir maj && ditto dist/Pilote.app maj/Pilote.app
          echo "version d'essai" > maj/Pilote.app/Contents/Resources/temoin-maj.txt
          codesign --force --deep -s - maj/Pilote.app > /dev/null 2>&1 || true
          (cd maj && ditto -c -k --keepParent Pilote.app ../Pilote_Mac.zip)
          # Serveur de la fausse release : sans getfqdn, comme celui de Pilote sur
          # Mac, pour que la question « reseau local » de la capture ne vienne
          # pas du test lui-meme
          python -c "import http.server as h, socketserver as s
          class S(h.ThreadingHTTPServer):
              def server_bind(self):
                  s.TCPServer.server_bind(self); self.server_name, self.server_port = self.server_address[:2]
          S(('127.0.0.1', 8765), h.SimpleHTTPRequestHandler).serve_forever()" > http.log 2>&1 &
          SRV=$!
          PILOTE_DIAG=1 PILOTE_MAJ_ESSAI="http://127.0.0.1:8765/Pilote_Mac.zip|99.0.0" \
            /Applications/Pilote.app/Contents/MacOS/Pilote > maj.log 2>&1 &
          PID=$!
          FIN="toujours ouverte apres 90 s"
          for i in $(seq 1 90); do
            if ! kill -0 $PID 2>/dev/null; then FIN="fermee apres $i s"; break; fi
            sleep 1
          done
          # Le script remplace l'app puis la relance par « open »
          RELANCE="pas relancee"
          for i in $(seq 1 40); do
            if pgrep -f "/Applications/Pilote.app/Contents/MacOS/Pilote" > /dev/null; then RELANCE="relancee"; break; fi
            sleep 1
          done
          # L'app relancee peut prendre 7439 : juste apres la fermeture de
          # l'ancienne, 7438 garde des connexions en attente (TIME_WAIT)
          PING="aucun port de 7438 a 7445 apres 60 s"
          for i in $(seq 1 60); do
            for P in 7438 7439 7440 7441 7442 7443 7444 7445; do
              if curl -fsS http://127.0.0.1:$P/ping > /dev/null 2>&1; then PING="200 sur $P en $i s"; break 2; fi
            done
            sleep 1
          done
          sleep 3
          screencapture -x capture-maj.png || true
          # Relancee par le Finder (open), Pilote fait demander par macOS l'acces
          # au reseau local : ses connexions, et ce que macOS en a note
          NPID=$(pgrep -f "/Applications/Pilote.app/Contents/MacOS/Pilote" | head -1)
          echo "::notice title=Sockets::$(lsof -nP -a -p "$NPID" -i 2>/dev/null | tail -n +2 | awk '{print $8, $9, $10}' | sort | uniq -c | tr '\n' ' ' | head -c 2500)"
          echo "::notice title=Reseau local::$(log show --last 3m --style compact --predicate 'eventMessage CONTAINS[c] "local network" OR eventMessage CONTAINS[c] "LocalNetwork" OR process == "nehelper"' 2>/dev/null | grep -v '^Timestamp' | tail -n 30 | tr '\n' ' ' | head -c 3500)"
          TEMOIN=$(test -f /Applications/Pilote.app/Contents/Resources/temoin-maj.txt && echo "nouvelle version en place" || echo "ancienne version")
          RESTE=$(ls -d /Applications/Pilote.app.ancienne 2>/dev/null && echo "ancienne app restee" || echo "ancienne app retiree")
          echo "::notice title=Mise a jour::$FIN ; $RELANCE (ping $PING) ; $TEMOIN ; $RESTE ; $(grep "\[maj\]" maj.log | tr '\n' ' ' | head -c 1500)"
          echo "::notice title=Mise a jour (journaux)::$(tail -c 600 "$HOME/Library/Logs/Pilote/update_sh.log" 2>/dev/null | tr '\n' ' ') | $(grep "INSTALL" "$HOME/Library/Logs/Pilote/update.log" 2>/dev/null | tail -n 6 | tr '\n' ' ' | head -c 1500)"
          # Refus de l'acces au reseau local (« Don't Allow ») : Pilote doit
          # marcher quand meme (127.0.0.1 et internet n'en dependent pas)
          REFUS=$(osascript <<'OSA' 2>&1
          tell application "System Events"
            set n to 0
            repeat with p in (every process)
              try
                repeat with w in (every window of p)
                  try
                    repeat with b in (every button of w)
                      if name of b is in {"Don’t Allow", "Don't Allow", "Ne pas autoriser"} then
                        click b
                        set n to n + 1
                      end if
                    end repeat
                  end try
                end repeat
              end try
            end repeat
            return n
          end tell
          OSA
          )
          pkill -f "/Applications/Pilote.app/Contents/MacOS/Pilote" || true
          sleep 4
          # Relance par le Finder, avec le diagnostic : page, internet, et une
          # nouvelle demande eventuelle (capture)
          open -n --env PILOTE_DIAG=1 --stdout "$PWD/apres-refus.log" --stderr "$PWD/apres-refus.log" /Applications/Pilote.app
          for i in $(seq 1 50); do
            grep -q "\[diag\]" apres-refus.log 2>/dev/null && grep -q "\[https\] cours" apres-refus.log 2>/dev/null && break
            sleep 1
          done
          screencapture -x capture-maj.png || true
          echo "::notice title=Apres refus::boutons refuses : $REFUS ; $(grep -E "\[diag\]|\[https\] (reglages|cours)" apres-refus.log | tr '\n' ' ' | head -c 2500)"
          pkill -f "/Applications/Pilote.app/Contents/MacOS/Pilote" || true
          kill $SRV 2>/dev/null || true
          exit 0

      - name: Install test (Terminal)
        continue-on-error: true
        timeout-minutes: 8
        # Installation en une ligne (README) : un fichier telecharge par curl ne
        # porte pas la marque de quarantaine, donc ni « Ouvrir quand meme », ni
        # copie en lecture seule (App Translocation), ni « endommage ». Essai sur
        # la vraie derniere release ; en regard, la meme app marquee comme
        # telechargee par un navigateur.
        if: always()
        run: |
          pkill -f "Pilote.app/Contents/MacOS/Pilote" || true
          rm -rf /Applications/Pilote.app
          sleep 2
          echo "::notice title=Gatekeeper::$(spctl --status 2>&1)"
          curl -fL https://github.com/arthur-soulard/arthurpilote.github.com/releases/latest/download/Pilote_Mac.zip -o /tmp/Pilote_Mac.zip && ditto -x -k /tmp/Pilote_Mac.zip /Applications && open /Applications/Pilote.app
          CODE=$?
          PING="aucun port apres 60 s"
          for i in $(seq 1 60); do
            for P in 7438 7439 7440 7441; do
              if curl -fsS http://127.0.0.1:$P/ping > /dev/null 2>&1; then PING="200 sur $P en $i s"; break 2; fi
            done
            sleep 1
          done
          CHEMIN=$(ps -axo command | grep "MacOS/Pilote" | grep -v grep | head -1 || true)
          QUAR=$(xattr -p com.apple.quarantine /Applications/Pilote.app 2>/dev/null || echo "aucune")
          echo "::notice title=Installation Terminal::code $CODE ; ping $PING ; quarantaine : $QUAR ; lancee depuis : $CHEMIN ; $(defaults read /Applications/Pilote.app/Contents/Info.plist CFBundleShortVersionString 2>/dev/null)"
          sleep 3
          screencapture -x capture-installation.png || true
          pkill -f "Pilote.app/Contents/MacOS/Pilote" || true
          sleep 3
          # En regard : l'app du build, marquee comme telechargee par Safari,
          # ouverte depuis Telechargements. Drapeaux de quarantaine : 0081
          # (telechargee), puis 00c1 / 01c1 (deja approuvee, comme apres
          # « Ouvrir quand meme »). Lancee en copie (App Translocation), Pilote
          # resterait retenue par Gatekeeper : essai du rangement a l etape suivante.
          rm -rf /Applications/Pilote.app
          RES=""
          for F in 0081 00c1 01c1; do
            pkill -f CoreServicesUIAgent || true
            rm -rf "$HOME/Downloads/Pilote.app"
            ditto dist/Pilote.app "$HOME/Downloads/Pilote.app"
            xattr -w com.apple.quarantine "$F;$(printf %x $(date +%s));Safari;" "$HOME/Downloads/Pilote.app"
            # En arriere-plan : bloquee par Gatekeeper, « open » attend la
            # reponse a sa fenetre (vu le 22/10/2026 : etape figee)
            open "$HOME/Downloads/Pilote.app" > /dev/null 2>&1 &
            sleep 15
            NAV=$(ps -axo command | grep "MacOS/Pilote" | grep -v grep | head -1 || true)
            RES="$RES [$F] ${NAV:-non lancee}"
            if [ "$F" = "0081" ]; then screencapture -x capture-navigateur.png || true; fi
            if echo "$NAV" | grep -q AppTranslocation; then
              break   # copie en lecture seule, retenue par Gatekeeper (capture)
            fi
            pkill -f "Pilote.app/Contents/MacOS/Pilote" || true
            sleep 2
          done
          echo "::notice title=Installation navigateur::$RES"
          exit 0

      - name: Rangement test
        # Pilote se range lui-meme dans Applications (updater.mac_ranger). Sur
        # cette machine, Gatekeeper retient l'app avant qu'elle s'ouvre (personne
        # pour « Ouvrir quand meme ») : la copie en lecture seule est creee ici
        # par la meme API que macOS, puis mac_ranger part de cette copie.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          pkill -f "Pilote.app/Contents/MacOS/Pilote" || true
          pkill -f CoreServicesUIAgent || true
          rm -rf /Applications/Pilote.app "$HOME/Downloads/Pilote.app"
          ditto dist/Pilote.app "$HOME/Downloads/Pilote.app"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$HOME/Downloads/Pilote.app"
          cat > ranger.py <<'EOF'
          import ctypes, sys, objc
          from pathlib import Path
          from Foundation import NSURL
          sys.path.insert(0, "src")
          import updater
          sec = ctypes.CDLL("/System/Library/Frameworks/Security.framework/Security")
          f = sec.SecTranslocateCreateSecureDirectoryForURL
          f.restype = ctypes.c_void_p
          f.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p]
          src = NSURL.fileURLWithPath_(str(Path.home() / "Downloads" / "Pilote.app"))
          ptr = f(objc.pyobjc_id(src), None, None)
          copie = Path(str(objc.objc_object(c_void_p=ptr).path())) if ptr else None
          print("[ranger] copie :", copie)
          print("[ranger] origine retrouvee :", copie and updater._origine_mac(copie))
          if copie:
              updater._bundle_mac = lambda: copie
              print("[ranger] mac_ranger :", updater.mac_ranger())
          EOF
          python ranger.py > ranger.log 2>&1
          for i in $(seq 1 30); do
            test -d /Applications/Pilote.app && ! test -e "$HOME/Downloads/Pilote.app" && break
            sleep 1
          done
          sleep 10
          APRES=$(ps -axo command | grep "MacOS/Pilote" | grep -v grep | head -1 || true)
          echo "::notice title=Rangement::$(cat ranger.log | tr '\n' ' ' | head -c 1500) ; Applications : $(test -d /Applications/Pilote.app && echo oui || echo non) ; Telechargements : $(test -e "$HOME/Downloads/Pilote.app" && echo reste || echo vide) ; quarantaine : $(xattr -p com.apple.quarantine /Applications/Pilote.app 2>/dev/null || echo aucune) ; relancee : ${APRES:-non} ; $(tail -c 300 "$HOME/Library/Logs/Pilote/update_sh.log" 2>/dev/null | tr '\n' ' ')"
          sleep 2
          screencapture -x capture-ranger.png || true
          pkill -f "Pilote.app/Contents/MacOS/Pilote" || true

      - name: Capture (annotations)
        # Les artefacts ne se lisent qu'avec un compte : une petite copie JPEG de
        # la capture sort en annotations, en base64 decoupe en morceaux
        if: always()
        run: |
          # La capture apres la mise a jour (app relancee) si elle existe, sinon la premiere
          # (ou celle de l'app marquee « telechargee par Safari », qui montre Gatekeeper)
          CAP=capture.png; test -f capture-maj.png && CAP=capture-maj.png
          test -f capture-navigateur.png && CAP=capture-navigateur.png
          test -f capture-ranger.png && CAP=capture-ranger.png
          test -f "$CAP" || exit 0
          sips -s format jpeg -s formatOptions 25 -Z 720 "$CAP" --out cap.jpg > /dev/null
          { base64 -i cap.jpg | tr -d '\n' | fold -w 3800; echo; } > cap.b64
          # 10 annotations au plus par etape : les morceaux 1 a 10 ici, la suite apres
          N=$(wc -l < cap.b64 | tr -d ' ')
          i=0
          while read -r ligne; do
            i=$((i+1))
            if [ $i -le 10 ]; then echo "::notice title=Capture $i/$N::$ligne"; fi
          done < cap.b64
          exit 0

      - name: Capture (suite)
        if: always()
        run: |
          test -f cap.b64 || exit 0
          N=$(wc -l < cap.b64 | tr -d ' ')
          i=0
          while read -r ligne; do
            i=$((i+1))
            if [ $i -gt 10 ] && [ $i -le 20 ]; then echo "::notice title=Capture $i/$N::$ligne"; fi
          done < cap.b64
          exit 0

      - name: Zip app
        if: always()
        run: ditto -c -k --keepParent dist/Pilote.app Pilote-mac.zip || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilote-mac
          path: |
            Pilote-mac.zip
            capture.png
            pilote.log
            build.log
          if-no-files-found: ignore

  # Captures des ecrans de tests/ecrans.txt (a mettre a jour a chaque
  # fonctionnalite), sur les donnees d'exemple FICTIVES de
  # tests/donnees_exemple.py : le premier job demarre sur un utilisateur
  # vierge, qui ne montre que les Premiers pas. Un job a part, car GitHub
  # garde 50 annotations au plus par job et le premier en emet une trentaine.
  # Trois ecrans par job (lot) : chaque job a ses propres 50 annotations, les
  # captures restent nettes et toute l'app peut passer en une fois. Un lot sans
  # ecran s'arrete aussitot.
  lots:
    runs-on: ubuntu-latest
    outputs:
      lots: ${{ steps.n.outputs.lots }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Nombre de lots
        id: n
        # [1, 2, ...] : un lot par groupe de trois ecrans, 15 au plus
        run: |
          N=$(grep -v '^[[:space:]]*#' tests/ecrans.txt | sed '/^[[:space:]]*$/d' | wc -l)
          L=$(( (N + 2) / 3 )); [ "$L" -gt 15 ] && L=15; [ "$L" -lt 1 ] && L=1
          echo "lots=[$(seq -s, 1 $L)]" >> "$GITHUB_OUTPUT"

  ecrans-mac:
    needs: [build-mac, lots]
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        lot: ${{ fromJSON(needs.lots.outputs.lots) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: App du build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pilote-mac
          path: art

      - name: Captures
        run: |
          DEBUT=$(( (${{ matrix.lot }} - 1) * 3 ))
          LIGNES=$(grep -v '^[[:space:]]*#' tests/ecrans.txt | sed '/^[[:space:]]*$/d' | sed -n "$((DEBUT+1)),$((DEBUT+3))p")
          # « plein » en tete de ligne : capture de tout l'ecran (Dock compris)
          ECRANS=$(echo "$LIGNES" | sed 's/^plein //' | paste -sd ';' -)
          PLEINS=" $(echo "$LIGNES" | grep -n '^plein ' | cut -d: -f1 | tr '\n' ' ' || true) "
          if [ -z "$ECRANS" ]; then echo "lot ${{ matrix.lot }} : aucun ecran"; exit 0; fi
          ditto -x -k art/Pilote-mac.zip .
          python3 tests/donnees_exemple.py "$HOME/Library/Application Support/Pilote/Donnees"
          PILOTE_ECRANS="$ECRANS" Pilote.app/Contents/MacOS/Pilote > ecrans.log 2>&1 &
          PID=$!
          # Chaque « [ecran] n pret » de l'app : une capture de sa fenetre
          # (cadre lu par System Events), sinon de tout l'ecran ; tout l'ecran
          # aussi pour une ligne « plein »
          FAITES=0
          for i in $(seq 1 300); do
            N=$(grep -c "\[ecran\] [0-9]* pret" ecrans.log || true)
            while [ "$FAITES" -lt "$N" ]; do
              FAITES=$((FAITES+1))
              NOM=$(printf "ecran-%02d" $((DEBUT+FAITES)))
              CADRE=""
              case "$PLEINS" in
                *" $FAITES "*) sleep 1 ;;
                *) CADRE=$(osascript -e 'tell application "System Events" to tell process "Pilote" to get {position, size} of window 1' 2>/dev/null | tr -d ' ') ;;
              esac
              screencapture -x ${CADRE:+-R"$CADRE"} "$NOM.png" || echo "capture $FAITES impossible"
            done
            grep -q "\[ecran\] fin" ecrans.log && break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          # Icone de Pilote.app une fois fermee (lot qui change la couleur) :
          # celle que macOS rend pour le paquet (ecran 98), et le Finder (ecran 99)
          if echo "$LIGNES" | grep -q set_app_icon_color; then
            sleep 2
            APP="$PWD/Pilote.app"
            osascript -l JavaScript -e 'ObjC.import("AppKit"); var i=$.NSWorkspace.sharedWorkspace.iconForFile("'"$APP"'"); i.setSize({width:256,height:256}); $.NSBitmapImageRep.imageRepWithData(i.TIFFRepresentation).representationUsingTypeProperties(4, $()).writeToFileAtomically("'"$PWD"'/ecran-98.png", true)' || echo "icone illisible"
            open -R "$APP" || true
            sleep 4
            screencapture -x ecran-99.png || true
            echo "::notice title=Icone app::$(ls -la "$APP" | tr -d '\r' | tr '\n' ' ') | xattr : $(xattr "$APP" | tr '\n' ' ') | $(grep appicon ecrans.log | tr '\n' ' ' | head -c 800)"
          fi
          # Taille et qualite : les plus grandes qui tiennent en 45 morceaux
          # de 3800 caracteres (5 etapes de 9 annotations)
          for REGLAGE in "1024 45" "1024 35" "1024 27" "900 24" "800 20" "720 16" "600 12"; do
            set -- $REGLAGE
            TOTAL=0
            for f in ecran-*.png; do
              [ -f "$f" ] || continue
              sips -s format jpeg -s formatOptions $2 -Z $1 "$f" --out "${f%.png}.jpg" > /dev/null
              T=$(base64 -i "${f%.png}.jpg" | tr -d '\n' | wc -c | tr -d ' ')
              TOTAL=$((TOTAL + (T + 3799) / 3800))
            done
            [ "$TOTAL" -le 45 ] && break
          done
          # Une ligne d'annotation par morceau : « Ecran n i/N »
          : > ecrans.lignes
          for f in ecran-*.jpg; do
            [ -f "$f" ] || continue
            K=$(echo "$f" | sed 's/[^0-9]//g' | sed 's/^0*//')
            base64 -i "$f" | tr -d '\n' | fold -w 3800 > morceaux.txt
            echo >> morceaux.txt
            M=$(grep -c . morceaux.txt)
            i=0
            while read -r ligne; do
              [ -n "$ligne" ] || continue
              i=$((i+1))
              echo "::notice title=Ecran $K $i/$M::$ligne" >> ecrans.lignes
            done < morceaux.txt
          done
          echo "::notice title=Ecrans::$FAITES captures ($1 px, qualite $2, $TOTAL morceaux) ; $(grep -E '\[ecran\]|Traceback|Error' ecrans.log | tr '\n' ' ' | head -c 1500)"

      - name: Ecrans (1)
        if: always()
        run: sed -n '1,9p' ecrans.lignes 2>/dev/null || true
      - name: Ecrans (2)
        if: always()
        run: sed -n '10,18p' ecrans.lignes 2>/dev/null || true
      - name: Ecrans (3)
        if: always()
        run: sed -n '19,27p' ecrans.lignes 2>/dev/null || true
      - name: Ecrans (4)
        if: always()
        run: sed -n '28,36p' ecrans.lignes 2>/dev/null || true
      - name: Ecrans (5)
        if: always()
        run: sed -n '37,45p' ecrans.lignes 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecrans-mac-${{ matrix.lot }}
          path: |
            ecran-*.png
            ecrans.log
          if-no-files-found: ignore

  # Icone de Pilote.app a l'accent, comme chez Arthur (macOS 26, ecran « Apps ») :
  # app rangee dans Applications et gardee dans le Dock, lancee a l'accent par
  # defaut puis passee au vert, puis fermee. Captures du Dock et d'« Apps »
  # (ecrans 91 a 9x) apres chaque facon de faire relire l'icone a macOS.
  icone-mac:
    needs: build-mac
    if: ${{ !cancelled() }}
    timeout-minutes: 25
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: App du build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pilote-mac
          path: art

      - name: Icone apres un changement de couleur
        run: |
          set +e
          APP=/Applications/Pilote.app
          ditto -x -k art/Pilote-mac.zip /Applications
          xattr -dr com.apple.quarantine "$APP"
          python3 tests/donnees_exemple.py "$HOME/Library/Application Support/Pilote/Donnees"
          defaults write com.apple.dock persistent-apps -array-add "<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>file://$APP/</string><key>_CFURLStringType</key><integer>15</integer></dict></dict></dict>"
          killall Dock; sleep 6
          B=$(osascript -e 'tell application "Finder" to get bounds of window of desktop' | tr -d ' ')
          W=$(echo "$B" | cut -d, -f3); H=$(echo "$B" | cut -d, -f4)
          dock() { screencapture -x -R"0,$((H-140)),$W,140" "$1"; }
          apps() {
            open -a Apps 2>/dev/null || open -a Launchpad
            sleep 4
            osascript -e 'tell application "System Events" to keystroke "Pilote"'
            sleep 3
            screencapture -x "$1"
            osascript -e 'tell application "System Events" to key code 53'
            sleep 2
          }
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          relire() { touch "$APP"; "$LSREG" -f "$APP"; mdimport "$APP" 2>/dev/null; sleep 8; }
          # Lancee au prune (accent par defaut), passee au vert par le pont (icone
          # posee par-dessus le paquet, NSWorkspace), puis fermee
          PILOTE_ECRANS='home;js:pywebview.api.set_app_icon_color("#16a34a")' "$APP/Contents/MacOS/Pilote" > icone.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do grep -q "\[ecran\] fin" icone.log && break; sleep 1; done
          sleep 3
          kill $PID; sleep 2; kill -9 $PID 2>/dev/null; sleep 5
          # A : icone par-dessus, paquet relu (date, LaunchServices, Spotlight)
          relire
          dock ecran-91.png                          # 91 : Dock sans redemarrage
          killall Dock; sleep 8
          dock ecran-92.png                          # 92 : apres redemarrage du Dock
          sleep 20; apps ecran-93.png                # 93 : Apps
          # B : icone par-dessus retiree, l'icone du paquet elle-meme remplacee (violet)
          osascript -l JavaScript -e 'ObjC.import("AppKit"); $.NSWorkspace.sharedWorkspace.setIconForFileOptions($(), "'"$APP"'", 0)'
          ICNS="$APP/Contents/Resources/$(defaults read "$APP/Contents/Info" CFBundleIconFile | sed 's/\.icns$//').icns"
          python3 -m pip install --quiet --break-system-packages pillow > /dev/null 2>&1 || python3 -m pip install --quiet pillow > /dev/null 2>&1
          python3 -c "from PIL import Image; Image.new('RGBA', (1024, 1024), (124, 58, 237, 255)).save('$ICNS', sizes=[(16,16),(32,32),(128,128),(256,256),(512,512),(1024,1024)])"
          relire
          dock ecran-94.png                          # 94 : Dock sans redemarrage
          killall Dock; sleep 8
          dock ecran-95.png                          # 95 : apres redemarrage du Dock
          sleep 10; apps ecran-96.png                # 96 : Apps
          SIGN=$(codesign --verify "$APP" 2>&1 | tr '\n' ' ' | head -c 300)
          # L'app modifiee demarre-t-elle encore ?
          PILOTE_DIAG=1 "$APP/Contents/MacOS/Pilote" > relance.log 2>&1 &
          PID=$!
          UP=KO; for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7438/ping > /dev/null 2>&1 && { UP="$i s"; break; }; sleep 1; done
          for i in $(seq 1 40); do grep -q "fenetre ouverte" relance.log && break; sleep 1; done
          RELANCE="ping $UP ; $(grep -o 'fenetre ouverte ([a-z]*)' relance.log || echo 'pas de fenetre')"
          kill $PID 2>/dev/null; SLS="(non essaye)"
          # Taille et qualite : les plus grandes qui tiennent en 45 morceaux
          for REGLAGE in "1024 40" "900 30" "800 24" "720 18" "600 14" "500 10"; do
            set -- $REGLAGE
            TOTAL=0
            for f in ecran-*.png; do
              [ -f "$f" ] || continue
              sips -s format jpeg -s formatOptions $2 -Z $1 "$f" --out "${f%.png}.jpg" > /dev/null
              T=$(base64 -i "${f%.png}.jpg" | tr -d '\n' | wc -c | tr -d ' ')
              TOTAL=$((TOTAL + (T + 3799) / 3800))
            done
            [ "$TOTAL" -le 45 ] && break
          done
          : > icone.lignes
          for f in ecran-*.jpg; do
            [ -f "$f" ] || continue
            K=$(echo "$f" | sed 's/[^0-9]//g' | sed 's/^0*//')
            base64 -i "$f" | tr -d '\n' | fold -w 3800 > morceaux.txt
            echo >> morceaux.txt
            M=$(grep -c . morceaux.txt)
            i=0
            while read -r ligne; do
              [ -n "$ligne" ] || continue
              i=$((i+1))
              echo "::notice title=Ecran $K $i/$M::$ligne" >> icone.lignes
            done < morceaux.txt
          done
          echo "::notice title=Icone mac::macOS $(sw_vers -productVersion) ; ecran $W x $H ; $TOTAL morceaux ; icns : $ICNS ; signature : ${SIGN:-valide} ; relance : $RELANCE ; $(ls -la "$APP" | tr -d '\r' | tr '\n' ' ') ; $(grep -E 'appicon|\[ecran\]|Traceback|Error' icone.log | tr '\n' ' ' | head -c 1200)"

      - name: Icone (1)
        if: always()
        run: sed -n '1,9p' icone.lignes 2>/dev/null || true
      - name: Icone (2)
        if: always()
        run: sed -n '10,18p' icone.lignes 2>/dev/null || true
      - name: Icone (3)
        if: always()
        run: sed -n '19,27p' icone.lignes 2>/dev/null || true
      - name: Icone (4)
        if: always()
        run: sed -n '28,36p' icone.lignes 2>/dev/null || true
      - name: Icone (5)
        if: always()
        run: sed -n '37,45p' icone.lignes 2>/dev/null || true
