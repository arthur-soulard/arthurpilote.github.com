name: Build Windows (test)

# Le meme build que release.yml, sans rien publier : fabrique Pilote.exe sur une
# machine Windows de GitHub, verifie les fichiers embarques, lance l'exe et
# attend son serveur et sa page. Sert a s'assurer, avant de fusionner la
# branche mac dans main, que le code commun n'a rien casse sous Windows.
# Constats en annotations, lisibles sans compte (API publique des check-runs).

on:
  push:
    branches: [mac]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tests de la couche de donnees et des lecteurs de releves (QA-03, QA-05),
      # puis les memes controles en Python 3.8, celui du poste d'Arthur (QA-10)
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Python 3.8
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.8'

      # pwsh continue apres une commande en echec : chaque code de sortie est lu
      - name: Check with Python 3.8
        run: |
          python tests/verifier_release.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s tests -v

      - name: Back to Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller build/pilote.spec --clean --noconfirm

      - name: Check bundle
        shell: pwsh
        run: |
          # Les pieges de CLAUDE.md : sans ces fichiers, tout marche en dev et
          # rien dans l'exe
          foreach ($f in "dist/Pilote/Pilote.exe", "dist/Pilote/_internal/ocr_win.ps1",
                         "dist/Pilote/_internal/ui/vendor", "dist/Pilote/_internal/nouveautes.json") {
            if (-not (Test-Path $f)) { Write-Output "::error title=Bundle::$f absent"; exit 1 }
          }
          Write-Output "::notice title=Bundle::exe, ocr_win.ps1, ui/vendor et nouveautes.json presents"

      - name: Launch and check
        shell: pwsh
        run: |
          # Sortie redirigee : l'exe ecrit dans sortie.log ; sans redirection,
          # dans pilote_diag.log (app.py, exe sans console) : les deux sont lus
          $env:PILOTE_DIAG = "1"
          $p = Start-Process -FilePath "dist/Pilote/Pilote.exe" -PassThru `
                 -RedirectStandardOutput sortie.log -RedirectStandardError pilote.err
          $up = $null
          for ($i = 1; $i -le 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7438/ping -TimeoutSec 2 | Out-Null; $up = $i; break } catch { Start-Sleep 1 }
          }
          for ($i = 1; $i -le 50; $i++) {
            if (((Get-Content sortie.log, pilote_diag.log -Raw -ErrorAction SilentlyContinue) -join " ") -match "\[diag\]") { break }
            Start-Sleep 1
          }
          $log = ((Get-Content sortie.log, pilote_diag.log -Raw -ErrorAction SilentlyContinue) -join " ") -replace "`r?`n", " "
          $ouverte = [regex]::Match($log, "fenetre ouverte \([a-z]+\)").Value
          $diag = [regex]::Match($log, "\[diag\] \{.*?\}\}?").Value
          Write-Output "::notice title=Serveur::ping $(if ($up) { "$up s" } else { 'KO' }) - $ouverte"
          Write-Output "::notice title=Diag::$($diag.Substring(0, [Math]::Min(3000, $diag.Length)))"
          $err = (Get-Content pilote.err -Raw -ErrorAction SilentlyContinue)
          if ($err) { Write-Output "::notice title=Erreurs::$(($err -replace "`r?`n", ' ').Substring(0, [Math]::Min(1500, $err.Length)))" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $up) { exit 1 }
          if ($diag -match "ERREUR ") { Write-Output "::error title=Diag::erreur JavaScript au demarrage"; exit 1 }

      # L'installeur et l'exe installe, avant toute publication (QA-06) : le
      # Setup compile, s'installe sans question dans un dossier temporaire, et
      # l'exe installe demarre avec ses donnees a cote de lui
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build and try the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Setup::compilation impossible"; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP "Pilote essai"
          # Pas de -Wait : il attend aussi les processus lances par le Setup, et le
          # Setup silencieux relance Pilote ([Run], comme apres une mise a jour),
          # qui ne se ferme pas. On attend le Setup seul.
          $s = Start-Process -FilePath "dist\Pilote_Setup.exe" -PassThru `
                 -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          $null = $s.Handle
          if (-not $s.WaitForExit(300000)) { Write-Output "::error title=Setup::installation silencieuse bloquee"; exit 1 }
          if ($s.ExitCode -ne 0) { Write-Output "::error title=Setup::installation silencieuse KO ($($s.ExitCode))"; exit 1 }
          foreach ($f in "$dir/Pilote.exe", "$dir/_internal/nouveautes.json", "$dir/THIRD-PARTY-NOTICES.txt") {
            if (-not (Test-Path $f)) { Write-Output "::error title=Setup::$f absent apres installation"; exit 1 }
          }
          # Le Pilote relance par le Setup doit repondre
          $up = $null
          for ($i = 1; $i -le 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7438/ping -TimeoutSec 2 | Out-Null; $up = $i; break } catch { Start-Sleep 1 }
          }
          Start-Sleep 3
          Get-Process Pilote -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $up) { Write-Output "::error title=Setup::Pilote relance par le Setup ne repond pas"; exit 1 }
          if (-not (Test-Path "$dir\Donnees")) { Write-Output "::error title=Setup::Donnees absent a cote de l'exe"; exit 1 }
          Write-Output "::notice title=Setup::installe, lance (ping $up s), Donnees a cote de l'exe"

      # Le paquet du Microsoft Store (docs/microsoft-store.md) : fabrique, signe
      # par un certificat d'essai (le Store re-signe le vrai), installe, lance.
      # Les donnees doivent aller dans ~\Pilote\Donnees, pas dans le paquet, et
      # rester apres la desinstallation.
      - name: Build and try the Store package
        shell: pwsh
        run: |
          Get-Process Pilote -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          python build/msix.py
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=MSIX::fabrication impossible"; exit 1 }
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Pilote Essai" -KeyUsage DigitalSignature `
                    -FriendlyName "Pilote essai" -CertStoreLocation "Cert:\CurrentUser\My" `
                    -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "essai.pfx"
          $mdp = ConvertTo-SecureString -String "essai" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $mdp | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $mdp | Out-Null
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p essai dist\Pilote.msix
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=MSIX::signature d'essai impossible"; exit 1 }
          Add-AppxPackage -Path dist\Pilote.msix
          $pkg = Get-AppxPackage -Name Pilote.Essai
          if (-not $pkg) { Write-Output "::error title=MSIX::paquet non installe"; exit 1 }
          Start-Process explorer.exe "shell:AppsFolder\$($pkg.PackageFamilyName)!Pilote"
          $up = $null
          for ($i = 1; $i -le 90; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7438/ping -TimeoutSec 2 | Out-Null; $up = $i; break } catch { Start-Sleep 1 }
          }
          Start-Sleep 3
          $exe = (Get-Process Pilote -ErrorAction SilentlyContinue | Select-Object -First 1).Path
          Get-Process Pilote -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $donnees = Join-Path $HOME "Pilote\Donnees"
          Write-Output "::notice title=MSIX::ping $(if ($up) { "$up s" } else { 'KO' }) - exe $exe - donnees $((Get-ChildItem $donnees -ErrorAction SilentlyContinue).Name -join ', ')"
          if (-not $up) { Write-Output "::error title=MSIX::Pilote du paquet ne repond pas"; exit 1 }
          if ($exe -notmatch "WindowsApps") { Write-Output "::error title=MSIX::le Pilote lance n'est pas celui du paquet"; exit 1 }
          if (-not (Test-Path $donnees)) { Write-Output "::error title=MSIX::$donnees absent"; exit 1 }
          if (Test-Path (Join-Path $pkg.InstallLocation "Donnees")) { Write-Output "::error title=MSIX::Donnees dans le paquet"; exit 1 }
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (-not (Test-Path $donnees)) { Write-Output "::error title=MSIX::donnees effacees par la desinstallation"; exit 1 }
          Write-Output "::notice title=MSIX::installe, lance, donnees dans ~\Pilote\Donnees, gardees apres desinstallation"
