name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

# Actions designees par leur commit (une etiquette comme v4 peut etre deplacee),
# droit d'ecriture seulement dans les jobs qui joignent un fichier a la release
# (audit du 20/10/2026, SUP-02)
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Garde-fous avant publication (audit du 20/10/2026) : jusqu'a la 4.4.20,
      # chaque tag partait chez tous les utilisateurs sans aucun essai
      - name: Check versions
        run: python tests/verifier_release.py ${{ github.ref_name }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller build/pilote.spec --clean --noconfirm

      - name: Check bundle
        shell: pwsh
        run: |
          foreach ($f in "dist/Pilote/Pilote.exe", "dist/Pilote/_internal/ocr_win.ps1",
                         "dist/Pilote/_internal/ui/vendor", "dist/Pilote/_internal/nouveautes.json") {
            if (-not (Test-Path $f)) { Write-Output "::error title=Bundle::$f absent"; exit 1 }
          }

      # L'exe doit demarrer, servir la page et la page tourner sans erreur
      # JavaScript (journal [diag] de app.py, comme build-windows.yml)
      - name: Launch and check
        shell: pwsh
        run: |
          $env:PILOTE_DIAG = "1"
          $p = Start-Process -FilePath "dist/Pilote/Pilote.exe" -PassThru `
                 -RedirectStandardOutput sortie.log -RedirectStandardError pilote.err
          $up = $null
          for ($i = 1; $i -le 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7438/ping -TimeoutSec 2 | Out-Null; $up = $i; break } catch { Start-Sleep 1 }
          }
          for ($i = 1; $i -le 50; $i++) {
            if (((Get-Content sortie.log, pilote_diag.log -Raw -ErrorAction SilentlyContinue) -join " ") -match "\[diag\]") { break }
            Start-Sleep 1
          }
          $log = ((Get-Content sortie.log, pilote_diag.log -Raw -ErrorAction SilentlyContinue) -join " ") -replace "`r?`n", " "
          $diag = [regex]::Match($log, "\[diag\] \{.*?\}\}?").Value
          Write-Output "::notice title=Diag::$($diag.Substring(0, [Math]::Min(3000, $diag.Length)))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $up) { Write-Output "::error title=Lancement::le serveur ne repond pas"; exit 1 }
          if (-not $diag) { Write-Output "::error title=Lancement::journal [diag] absent"; exit 1 }
          if ($diag -match "ERREUR ") { Write-Output "::error title=Lancement::erreur JavaScript au demarrage"; exit 1 }
          if ($diag -match "REJET ") { Write-Output "::warning title=Lancement::promesse rejetee au demarrage" }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss'
        shell: pwsh

      # Texte de la page : comment installer, puis la fiche de la version
      # (jusqu'a la 4.4.27, la liste des commits, illisible pour un utilisateur)
      - name: Release notes
        run: python build/notes_release.py ${{ github.ref_name }} notes_release.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "Pilote ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: notes_release.md
          # Build onedir : Pilote.exe seul ne tourne pas sans son _internal/,
          # seul le Setup est publie (c'est aussi lui que prend updater.py)
          files: |
            dist/Pilote_Setup.exe

  # App Mac (docs/mac.md), jointe a la meme release APRES le Setup : job a
  # part, qui attend que la release existe ; s'il echoue, le Setup est deja
  # publie et les PC se mettent a jour normalement. updater.py sur Mac prend
  # Pilote_Mac.zip (MAC_ASSET) ; tant qu'il manque, aucun Mac ne voit la version.
  mac:
    needs: build
    runs-on: macos-15          # puce Apple
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app (PyInstaller)
        run: python -m PyInstaller build/pilote-mac.spec --clean --noconfirm

      - name: Check bundle
        run: |
          test -x dist/Pilote.app/Contents/MacOS/Pilote
          test -d dist/Pilote.app/Contents/Resources/ui/vendor
          test -f dist/Pilote.app/Contents/Resources/nouveautes.json

      - name: Zip app
        # ditto garde les liens et attributs du paquet (zip les abimerait)
        run: ditto -c -k --keepParent dist/Pilote.app Pilote_Mac.zip

      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Pilote_Mac.zip
